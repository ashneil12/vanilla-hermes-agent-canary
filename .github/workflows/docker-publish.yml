name: Docker Build and Publish

on:
  # Manual-dispatch only. This workflow IS the image publisher: builderbox-1 (the
  # former auto-publisher) was retired, so nothing auto-builds on merge. After
  # merging to main, dispatch this explicitly:
  #   gh workflow run docker-publish.yml --ref main
  workflow_dispatch:
    inputs:
      force_floating:
        description: "Move :latest/:stable even if the registry tag is not an ancestor (divergent cutover)"
        type: boolean
        default: false

permissions:
  contents: read

# Main-branch builds publish the image used by the Proxmox VM fleet. Prefer the
# newest main build over preserving older in-flight runs; otherwise a slow arm64
# build can hold :stable back from the commit we are trying to bake.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Image namespace tracks the repository: the canary fork publishes
# ...vanilla-hermes-agent-canary and the prod fork publishes
# ...vanilla-hermes-agent — one workflow, both forks treated the same.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    if: github.repository == 'ashneil12/vanilla-hermes-agent-canary' || github.repository == 'ashneil12/vanilla-hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      pushed_sha_tag: ${{ steps.mark_pushed.outputs.pushed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: recursive
          fetch-depth: 1000

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image (amd64, smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image starts
        run: |
          mkdir -p /tmp/hermes-test
          sudo chown -R 10000:10000 /tmp/hermes-test
          docker run --rm \
            -v /tmp/hermes-test:/opt/data \
            "$IMAGE:test" --help

      - name: Test dashboard subcommand
        run: |
          mkdir -p /tmp/hermes-test
          sudo chown -R 10000:10000 /tmp/hermes-test
          docker run --rm \
            -v /tmp/hermes-test:/opt/data \
            "$IMAGE:test" dashboard --help

      # Regression gate: media (image/video/audio) tool wiring must be intact in
      # the freshly built image BEFORE we publish :stable. If an upstream-sync
      # rebase or refactor drops a fix (handler signature, toolset membership,
      # Venice retrieve endpoint, steering guidance), this fails the job and the
      # SHA/:stable push steps are skipped — the fleet keeps the last good image.
      - name: Media tool wiring regression gate
        run: |
          # pytest is a dev dep and is no longer shipped in the runtime .venv
          # (upstream moved it out), so install it ephemerally into the throwaway
          # --rm test container before running the gate — keeps the shipped image
          # light (cardinal rule #1) while still running the regression gate.
          docker run --rm \
            --entrypoint sh \
            "$IMAGE:test" \
            -lc 'cd /opt/hermes && /usr/local/bin/uv pip install --python /opt/hermes/.venv/bin/python3 -q pytest pytest-timeout && /opt/hermes/.venv/bin/python3 -m pytest tests/tools/test_media_generation_wiring.py -q'


      - name: Log in to GitHub Container Registry
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'release' ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push an immutable per-commit SHA tag first. Floating tags move in the
      # follow-up job after an ancestor check, which prevents stale runs from
      # clobbering :latest or :stable.
      - name: Push amd64 image with SHA tag (main branch)
        id: push_sha
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mark SHA tag pushed
        id: mark_pushed
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image (release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  move-floating-tags:
    if: |
      (github.repository == 'ashneil12/vanilla-hermes-agent-canary' || github.repository == 'ashneil12/vanilla-hermes-agent')
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
      && needs.build-and-push.outputs.pushed_sha_tag == 'true'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-move-floating-tags-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1000

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to move floating tags
        id: latest_check
        env:
          FORCE_FLOATING: ${{ github.event.inputs.force_floating }}
        run: |
          set -euo pipefail
          image="$IMAGE"

          # Divergent cutover (e.g. fresh-start force-push): the registry :latest
          # is not an ancestor of this commit, so the safety check below would
          # refuse. An explicit force_floating dispatch overrides it.
          if [ "${FORCE_FLOATING:-}" = "true" ]; then
            echo "force_floating requested — moving floating tags unconditionally."
            echo "push_floating=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image_json=$(
            docker buildx imagetools inspect "${image}:latest" \
              --format '{{ json (index .Image "linux/amd64") }}' \
              2>/dev/null || true
          )

          if [ -z "${image_json}" ]; then
            echo "No existing :latest (or inspect failed) — safe to publish."
            echo "push_floating=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha=$(
            printf '%s' "${image_json}" \
              | jq -r '.config.Labels."org.opencontainers.image.revision" // ""'
          )

          if [ -z "${current_sha}" ]; then
            echo "Registry :latest has no revision label — safe to publish."
            echo "push_floating=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Registry :latest is at ${current_sha}"
          echo "This run is at      ${GITHUB_SHA}"

          if [ "${current_sha}" = "${GITHUB_SHA}" ]; then
            echo ":latest already points at our SHA — nothing to do."
            echo "push_floating=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${current_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --prune origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              || true
          fi

          if ! git cat-file -e "${current_sha}^{commit}" 2>/dev/null; then
            echo "Registry :latest points at an unknown commit (${current_sha}); refusing to overwrite."
            echo "push_floating=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "${current_sha}" "${GITHUB_SHA}"; then
            echo "Our commit is a descendant of :latest — safe to advance."
            echo "push_floating=true" >> "$GITHUB_OUTPUT"
          else
            echo "Another run advanced :latest past us (or diverged) — leaving it alone."
            echo "push_floating=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move :latest and :stable to this SHA
        if: steps.latest_check.outputs.push_floating == 'true'
        run: |
          set -euo pipefail
          image="$IMAGE"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:stable" \
            "${image}:${GITHUB_SHA}"

# canary: amd64-only image channel for hermesdeploy-canary dog-fooding
